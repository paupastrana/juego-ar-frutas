<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego AR - Atrapa la Fruta</title>

    <!-- A-Frame PRIMERO -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js DESPUÉS (esto es lo que faltaba) -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interfaz de Usuario -->
    <div id="ui-container">
        <div id="scoreboard">Puntos: <span id="score">0</span> | Vidas: <span id="vidas">3</span></div>
        <div id="game-over-screen" class="hidden">
            <h1>¡Fin del Juego!</h1>
            <p>Puntaje final: <span id="final-score">0</span></p>
            <button onclick="reiniciarJuego()">Jugar de nuevo</button>
        </div>

        <div id="controls">
            <button id="btn-left" ontouchstart="moverCanasta(-0.4)" onmousedown="moverCanasta(-0.4)">◀</button>
            <button id="btn-right" ontouchstart="moverCanasta(0.4)" onmousedown="moverCanasta(0.4)">▶</button>
        </div>
    </div>

    <!-- Escena 3D con AR -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
    >
        <a-assets>
            <a-asset-item id="canasta-model" src="models/canasta.glb"></a-asset-item>
            <a-asset-item id="fruta1-model" src="models/manzana.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#FFF" intensity="1"></a-light>
        <a-light type="directional" position="0 3 2" intensity="1"></a-light>

        <!-- Todo va DENTRO del marcador Hiro para que aparezca sobre él -->
        <a-marker preset="hiro" id="markerHiro">
            <a-entity id="canasta" gltf-model="#canasta-model" position="0 0.2 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity id="objeto-caida" gltf-model="#fruta1-model" position="0 1.5 0" scale="0.3 0.3 0.3"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="script.js"></script>
</body>
</html>
