<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Atrapa las frutas AR</title>
    <link rel="stylesheet" href="style.css">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

    <!-- Cámara del celular -->
    <video id="camera-video" autoplay muted playsinline></video>

    <!-- Interfaz de Usuario -->
    <div id="ui-container">
        <div id="scoreboard">
            Puntos: <span id="score">0</span> | Vidas: <span id="vidas">3</span>
        </div>

        <div id="start-screen">
            <h2>Atrapa las frutas</h2>
            <p>Usa los botones para mover la canasta.</p>
            <button id="btn-start">Activar cámara y jugar</button>
            <p id="camera-status">La cámara todavía no está activada.</p>
        </div>

        <div id="game-over-screen" class="hidden">
            <h2>¡Fin del juego!</h2>
            <p>Puntaje final: <span id="final-score">0</span></p>
            <button id="btn-restart">Jugar de nuevo</button>
        </div>

        <div id="controls">
            <button id="btn-left" aria-label="Mover a la izquierda">◀</button>
            <button id="btn-right" aria-label="Mover a la derecha">▶</button>
        </div>
    </div>

    <!-- Escena 3D transparente sobre la cámara -->
    <a-scene
        id="game-scene"
        embedded
        vr-mode-ui="enabled: false"
        renderer="alpha: true; antialias: true; colorManagement: true"
        loading-screen="enabled: false">

        <a-assets timeout="20000">
            <a-asset-item id="canasta-model" src="models/canasta.glb"></a-asset-item>
            <a-asset-item id="fruta-model" src="models/manzana.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#FFFFFF" intensity="2"></a-light>
        <a-light type="directional" color="#FFFFFF" intensity="2" position="-1 3 2"></a-light>

        <!-- Canasta (inicialmente oculta) -->
        <a-entity id="canasta"
                  gltf-model="#canasta-model"
                  position="0 -1.25 -3"
                  scale="0.5 0.5 0.5"
                  visible="false">
        </a-entity>

        <!-- Fruta (inicialmente oculta) -->
        <a-entity id="fruta"
                  gltf-model="#fruta-model"
                  position="0 2 -3"
                  scale="0.3 0.3 0.3"
                  visible="false">
        </a-entity>

        <a-entity camera position="0 0 0"></a-entity>
    </a-scene>

    <script src="script.js"></script>
</body>
</html>
